; 晴屿 SUNISLE B - desktop memo/reminder companion
; Verified hardware params are FROZEN; see HARDWARE_CONFIG.md.
; B version: display + LVGL + SD + touch + memo reminders
;            + WorkBuddy CMD| / SKILL| / TASK| protocol (serial + optional HTTP).

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include
lib_dir = lib

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dout
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
board_build.partitions = partitions_sunisle.csv

build_flags =
    -I include
    -D CORE_DEBUG_LEVEL=1
    -D LV_CONF_INCLUDE_SIMPLE=1
    -D LV_LVGL_H_INCLUDE_SIMPLE=1
    -D SUNISLE_STAGE=1

; Same locked versions as the audited project. LVGL major version and the
; display library MUST NOT be changed (task book section 11).
lib_deps =
    lovyan03/LovyanGFX@1.2.36
    lvgl/lvgl@8.3.11

lib_ldf_mode = deep+
monitor_filters = esp32_exception_decoder
